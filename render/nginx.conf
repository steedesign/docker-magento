server {
    listen 8080;
    server_name _;

    root /var/www/html/pub;
    index index.php index.html;

    # Algemene frontend
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 1) Versioned static → strip "versionXXXX" uit de URL
    location ~* ^/static/version\d+/(.+)$ {
        rewrite ^/static/version\d+/(.+)$ /static/$1 last;
    }

    # 2) Static handling (laat Magento static.php het oplossen)
    location /static/ {
        try_files $uri $uri/ /static.php?resource=$uri&$args;
    }

    # 3) PHP (index.php, static.php, etc.)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;

        # headers/buffer fix
        fastcgi_buffer_size   64k;
        fastcgi_buffers       16 64k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout  300;
    }

    # 4) Media direct serveren (optioneel, maar netjes)
    location /media/ {
        try_files $uri $uri/ /index.php$is_args$args;
        expires max;
        log_not_found off;
    }
}
